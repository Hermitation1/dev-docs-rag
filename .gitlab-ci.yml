stages:
  - lint
  - test
  - build

default:
  image: python:3.12-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  POSTGRES_USER: devdocs
  POSTGRES_PASSWORD: devdocs
  POSTGRES_DB: devdocs
  TEST_DATABASE_URL: postgresql+asyncpg://devdocs:devdocs@postgres:5432/devdocs
  REDIS_URL: redis://redis:6379/15
  CELERY_BROKER_URL: amqp://devdocs:devdocs@rabbitmq:5672//

lint:
  stage: lint
  before_script:
    - pip install --no-cache-dir uv==0.12.22
    - uv sync --frozen
  script:
    - uv run --frozen ruff format --check .
    - uv run --frozen ruff check .

test:
  stage: test
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
      variables:
        POSTGRES_USER: devdocs
        POSTGRES_PASSWORD: devdocs
        POSTGRES_DB: devdocs
    - name: redis:7-alpine
      alias: redis
    - name: rabbitmq:3-management-alpine
      alias: rabbitmq
      variables:
        RABBITMQ_DEFAULT_USER: devdocs
        RABBITMQ_DEFAULT_PASS: devdocs
  before_script:
    - pip install --no-cache-dir uv==0.12.22
    - uv sync --frozen
  script:
    - uv run --frozen pytest -m "unit or integration" --cov=src --cov-report=term-missing --cov-fail-under=80

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .

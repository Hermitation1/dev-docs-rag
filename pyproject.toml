[project]
name = "dev-docs-rag"
version = "0.1.0"
description = "Local retrieval-only RAG service over library documentation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "celery>=5.4",
    "docutils>=0.21",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "mcp>=2.3.0",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
devdocs = "dev_docs_rag.cli:main"
devdocs-mcp = "dev_docs_rag.mcp_server:main"

[dependency-groups]
dev = [

    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: tests without external services",
    "integration: tests that need Postgres, Redis or RabbitMQ",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/dev_docs_rag/cli.py",
    "src/dev_docs_rag/seed.py",
]
